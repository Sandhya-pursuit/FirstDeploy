name: DEV | Deploy eventhub

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'code/**'
      - '.github/workflows/deployDotnetCodeToFA.yml'
      - '.github/workflows/deployDotnetCodeToFAListner.yml'
      - 'listnerCode/**'
      - '.github/workflows/deploy-cosmosbicep-pipeline.yml'
      - '.github/workflows/deploy-bicep-pipeline.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: eastus
  RESOURCE_GROUP: rg-dev-autodilab

  BICEP_FILE: templates/bicep/main.eventhubnseh.bicep
  BICEP_PARAM_FILE: templates/bicep/parameters/main-event.dev.bicepparam

  FUNCTIONAPP_NAME: funcapp-ps-autodilab
  FUNCTIONAPP_LISTENER_NAME: Funcapp-ps-eventlistner-autodilab

jobs:
  deploy-dev:
    name: Deploy DEV EventHub Infrastructure
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Validate Bicep
        run: |
          az deployment group validate \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.BICEP_PARAM_FILE }}

      - name: What-If (Preview Changes)
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.BICEP_PARAM_FILE }}

      - name: Deploy EventHub Bicep
        id: deployEventhub
        shell: bash
        run: |
          DEPLOY_OUTPUT=$(az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.BICEP_PARAM_FILE }} \
            --mode Incremental \
            --query properties.outputs \
            -o json)

          echo "eventHubFullyQualifiedNamespace=$(echo $DEPLOY_OUTPUT | jq -r '.eventHubFullyQualifiedNamespace.value')" >> $GITHUB_OUTPUT

          echo "eventHubName=$(echo $DEPLOY_OUTPUT | jq -r '.eventHubName.value')" >> $GITHUB_OUTPUT

      - name: Update Main Function App Settings
        run: |
          az functionapp config appsettings set \
            --name ${{ env.FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings \
            EventHubFullyQualifiedNamespace="${{ steps.deployEventhub.outputs.eventHubFullyQualifiedNamespace }}" \
            EventHubName="${{ steps.deployEventhub.outputs.eventHubName }}"

      - name: Update Listener Function App Settings
        run: |
          az functionapp config appsettings set \
            --name ${{ env.FUNCTIONAPP_LISTENER_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings \
            EventHubFullyQualifiedNamespace="${{ steps.deployEventhub.outputs.eventHubFullyQualifiedNamespace }}" \
            EventHubName="${{ steps.deployEventhub.outputs.eventHubName }}"