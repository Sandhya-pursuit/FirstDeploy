name: DEV | Deploy eventhub

on:
  push:
    branches:
      - dev
    paths-ignore:  
      - 'code/**'
      - '.github/workflows/deployDotnetCodeToFA.yml'
      - '.github/workflows/deployDotnetCodeToFAListner.yml'
      - 'listnerCode/**'
      - '.github/workflows/deploy-cosmosbicep-pipeline.yml'
      - '.github/workflows/deploy-bicep-pipeline.yml'
  workflow_dispatch: #to run the workflow manually from GitHub UI


permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: eastus
  RESOURCE_GROUP: rg-dev-autodilab
  BICEP_FILE: templates/bicep/main.eventhubnseh.bicep
  BICEP_PARAM_FILE: templates/bicep/parameters/main-event.dev.bicepparam
  FUNCTIONAPP_NAME: funcapp-ps-autodilab


jobs:
  deploy-dev:
    name: Deploy DEV Infrastructure
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Validate Bicep
        run: |
          az deployment group validate \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.BICEP_PARAM_FILE }}

      - name: What-If (Preview Changes)
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.BICEP_PARAM_FILE }}

      - name: Deploy Bicep to DEV
        id: deployEventhub
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.BICEP_PARAM_FILE }} \
            --mode Incremental

      - name: UpdateFunapp settings
        run: |
          Update-AzFunctionAppSetting \
            -Name ${{ env.FUNCTIONAPP_NAME }} \
            -ResourceGroupName ${{ env.RESOURCE_GROUP }} \
            -AppSetting @{"EventHubFullyQualifiedNamespace" = ${{ steps.deployEventhub.outputs.eventHubFullyQualifiedNamespace }}; 
            "EventHubName" = ${{ steps.deployEventhub.outputs.eventHubName }}}
      