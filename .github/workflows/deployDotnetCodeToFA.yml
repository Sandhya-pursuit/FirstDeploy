name: DEV | Deploy DotNet Function App

on:
  push:
    branches:
      - dev
    paths:
      - 'code/**'
      - '.github/workflows/deployDotnetCodeToFA.yml'
  workflow_dispatch:

permissions:
  id-token: write     
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: funcapp-ps-deploy
  DOTNET_VERSION: '8.0.x'
  FUNCTION_PROJECT: 'code/update_testcase'
  PUBLISH_DIR: publish

jobs:
# Build
  build:
    name: Build & Publish Function App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Function App
        shell: pwsh
        run: |
          dotnet publish ${{ env.FUNCTION_PROJECT }} -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Upload Function App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-artifact
          path: ${{ env.PUBLISH_DIR }}
          include-hidden-files: true

# ---------------- DEPLOY JOB ----------------
  deploy:
    name: Deploy to Azure Function App
    runs-on: windows-latest
    needs: build
    environment: dev

    steps:
      - name: Download Function App Artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-artifact
          path: publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: publish
