name: DEV | Deploy DotNet Function App

on:
  push:
    branches:
      - dev
    paths-ignore:  
      - 'templates/**'  
      - '.github/workflows/deploy-bicep-pipeline.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: funcapp-ps-deploy
  DOTNET_VERSION: '8.0.x'
  PACKAGE_PATH: './code'
  FUNCTION_PROJECT: code/Http_trigger_function/Http_trigger_function/Http_trigger_function.csproj

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build & Publish Function App
        shell: pwsh
        run: |
          dotnet publish ${{ env.FUNCTION_PROJECT }} `
            --configuration Release `
            --output ${{ env.PACKAGE_PATH }} `
            --runtime win-x64

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PACKAGE_PATH }}
